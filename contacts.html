<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Контакти — КаваLab</title><meta name="description" content="Демо-контакти та форма зворотного зв'язку КаваLab."><link rel="canonical" href="https://kavalab.vercel.app/contacts.html"><link rel="icon" href="assets/icons/favicon.svg"><link rel="stylesheet" href="css/style.css"><script src="https://cdn.tailwindcss.com/3.4.17"></script><script>tailwind.config={darkMode:"class"};</script></head>
<body><a class="skip-link" href="#main-content">Перейти до змісту</a><header class="border-b" style="border-color:var(--border)"><div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 py-4"><a class="font-extrabold" href="index.html">Кава<span class="text-coffee">Lab</span></a><nav aria-label="Основна навігація" class="flex flex-wrap gap-3 text-sm"><a href="menu.html">Меню</a><a href="builder.html">Конструктор</a><a href="reservation.html">Бронювання</a><a href="about.html">Про нас</a><a aria-current="page" href="contacts.html">Контакти</a></nav><div class="flex gap-2"><button class="min-h-12 rounded-xl border px-3 text-sm" style="border-color:var(--border)" data-theme-toggle aria-pressed="false" type="button">Темна тема</button><a class="min-h-12 rounded-xl border px-3 py-3" style="border-color:var(--border)" href="cart.html">Кошик (<span data-cart-count>0</span>)</a></div></div></header><main id="main-content" class="mx-auto max-w-6xl px-4 py-16"><h1 class="text-4xl font-extrabold">Контакти</h1><p class="muted mt-3">Демо: повідомлення не надсилаються на сервер.</p><div class="mt-8 grid gap-8 md:grid-cols-2"><section class="surface rounded-2xl p-6"><h2 class="text-2xl font-bold">Зв'язок</h2><address class="muted mt-4 not-italic">+380 32 000 00 00<br>hello@kavalab.example<br>Години: 08:00–22:00</address></section><section class="surface rounded-2xl p-6"><h2 class="text-2xl font-bold">Написати нам</h2><form class="mt-5 space-y-4" data-contact-form novalidate><label class="block">Ім'я<input class="mt-2 min-h-12 w-full rounded-xl border bg-transparent px-3" style="border-color:var(--border)" name="name" required></label><label class="block">Email<input class="mt-2 min-h-12 w-full rounded-xl border bg-transparent px-3" style="border-color:var(--border)" name="email" type="email" required></label><label class="block">Повідомлення<textarea class="mt-2 min-h-32 w-full rounded-xl border bg-transparent p-3" style="border-color:var(--border)" name="message" minlength="10" maxlength="500" required></textarea></label><label class="flex gap-2"><input name="consent" type="checkbox" required> Погоджуюся на обробку демо-даних</label><p class="text-sm" aria-live="polite" data-contact-status></p><button class="brand-button min-h-12 rounded-xl px-5 py-3 font-bold" type="submit">Надіслати демо-повідомлення</button></form></section></div></main><footer class="border-t" style="border-color:var(--border)"><div class="mx-auto max-w-6xl px-4 py-8 text-sm">© КаваLab · Демо-контакти</div></footer><script type="module" src="js/pages/contacts.js"></script></body></html>
