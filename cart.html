<main id="main-content" class="mx-auto max-w-6xl px-4 py-12"><h1 class="text-4xl font-extrabold">Кошик</h1><p class="muted mt-3">Замовлення зберігається лише у цьому браузері. Платежів немає.</p><div class="mt-8 grid gap-8 lg:grid-cols-[1fr_360px]"><section><div class="grid gap-3" data-cart-list></div><p class="mt-4 text-sm" aria-live="polite" data-cart-status></p></section><aside class="surface h-fit rounded-2xl p-6"><h2 class="text-2xl font-bold">Підсумок</h2><label class="mt-5 block">Промокод<input class="mt-2 min-h-12 w-full rounded-xl border bg-transparent px-3" style="border-color:var(--border)" data-promo placeholder="KAVALAB10" autocomplete="off"></label><button class="mt-3 min-h-12 w-full rounded-xl border px-4 font-bold" style="border-color:var(--border)" type="button" data-apply-promo>Застосувати</button><dl class="mt-5 space-y-2" data-cart-summary></dl><button class="brand-button mt-5 min-h-12 w-full rounded-xl px-5 py-3 font-bold" type="button" data-checkout>Оформити (демо)</button></aside></div><section class="surface mt-10 rounded-2xl p-6" data-checkout-form-section hidden><h2 class="text-2xl font-bold">Дані замовлення</h2><form class="mt-5 grid gap-4 sm:grid-cols-2" data-checkout-form novalidate><label>Ім'я<input class="mt-2 min-h-12 w-full rounded-xl border bg-transparent px-3" style="border-color:var(--border)" data-checkout-name required></label><label>Email<input class="mt-2 min-h-12 w-full rounded-xl border bg-transparent px-3" style="border-color:var(--border)" type="email" data-checkout-email required></label><label class="sm:col-span-2">Телефон<input class="mt-2 min-h-12 w-full rounded-xl border bg-transparent px-3" style="border-color:var(--border)" data-checkout-phone inputmode="tel" placeholder="+380XXXXXXXXX або 0XXXXXXXXX" required></label><label class="sm:col-span-2">Час отримання<input class="mt-2 min-h-12 w-full rounded-xl border bg-transparent px-3" style="border-color:var(--border)" type="datetime-local" data-pickup-time required></label><p class="text-sm sm:col-span-2" aria-live="polite" data-checkout-status></p><button class="brand-button min-h-12 rounded-xl px-5 py-3 font-bold sm:col-span-2" type="submit">Підтвердити демо-замовлення</button></form></section></main><footer class="border-t" style="border-color:var(--border)"><div class="mx-auto max-w-6xl px-4 py-8 text-sm">© КаваLab · Демо: платежів немає</div></footer><script type="module" src="js/pages/cart.js"></script></body></html>
